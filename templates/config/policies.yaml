schema_version: 1

brief:
  rolling_window_days: 7
  group_by_received_day: true
  source_links_required_for_source_backed_tasks: true

tasks:
  completion_requires_parent_comment: true
  completion_comment_structure: freeform
  reopen_when_comment_missing: true

attachments:
  excluded_content_policy: do_not_catalogue_sensitive_unrelated_content
  unsupported_outcome: manual_review

audio:
  enabled: false
  unavailable_behavior: disclose_optional_degradation

execution:
  max_records_per_unit: 25
  max_bytes_per_unit: 262144
  delivery_correction_policy: explicit_authorization_required
  manual_entrypoint_authorization: explicit_user_request_required
  serialization_mode: attended_single_writer
